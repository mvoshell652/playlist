name: Idea or request
description: Something the tool should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, more than the feature you have in mind. It helps to know which skills you load together and how often.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
